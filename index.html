<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Limbo workflow diagrams</title>
<style>
:root { --bg:#F6F6F9; --fg:#1E1C2A; --muted:#5B5870; --line:#B9B6C8; --accent:#231B6B; --accent-ink:#FFFFFF; --bad:#B91C1C; }
@media (prefers-color-scheme: dark) { :root { --bg:#12111A; --fg:#EDEBF5; --muted:#A7A3BC; --line:#4A4760; --accent:#8F83F0; --accent-ink:#12111A; --bad:#FF8A8A; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
form { width:min(380px,100%); display:flex; flex-direction:column; gap:12px; }
h1 { font-size:22px; margin:0; }
p { margin:0; color:var(--muted); font-size:14px; }
input { font:inherit; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); }
input:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
button { font:inherit; font-weight:600; padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink); cursor:pointer; }
button:disabled { opacity:.6; cursor:default; }
#msg { min-height:1.4em; color:var(--bad); font-size:14px; }
</style>
</head>
